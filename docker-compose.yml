services:
  backend:
    image: cbomkit-backend
    depends_on:
      - db
    environment:
      CBOMKIT_DB_TYPE: postgresql
      CBOMKIT_DB_JDBC_URL: jdbc:postgresql://db:5432/postgres
      CBOMKIT_PORT: 8081
      CBOMKIT_DB_USERNAME: ${POSTGRESQL_AUTH_USERNAME}
      CBOMKIT_DB_PASSWORD: ${POSTGRESQL_AUTH_PASSWORD}
      CBOMKIT_FRONTEND_URL_CORS: "https://${SERVER_IP:?SERVER_IP must be set}"
    expose:
      - "8081"
    volumes:
      - cbomkit-volume:/home/user/.cbomkit
    restart: always
    deploy:
      resources:
        reservations:
          memory: 8g
        limits:
          memory: 16g
  frontend:
    image: cbomkit-frontend
    environment:
      VUE_APP_HTTP_API_BASE: "https://${SERVER_IP:?SERVER_IP must be set}/"
      VUE_APP_WS_API_BASE: "wss://${SERVER_IP:?SERVER_IP must be set}/"
      VUE_APP_TITLE: "CBOMkit"
      VUE_APP_VIEWER_ONLY: ${CBOMKIT_VIEWER}
    expose:
      - "8000"
    restart: always
  db:
    image: docker.io/library/postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRESQL_AUTH_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_AUTH_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD", "pg_isready -U ${POSTGRESQL_AUTH_USERNAME} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - "pg-volume:/var/lib/postgresql/data/"
    restart: always
  nginx:
    image: docker.io/library/nginx:1.30.4-alpine3.24
    depends_on:
      - backend
      - frontend
    entrypoint:
      - /usr/sbin/nginx
    command:
      - -g
      - daemon off;
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - type: bind
        source: ${PKI_DIR:-./pki}/server.crt
        target: /etc/nginx/pki/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PKI_DIR:-./pki}/server.key
        target: /etc/nginx/pki/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PKI_DIR:-./pki}/ca.crt
        target: /etc/nginx/pki/ca.crt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: always
volumes:
  cbomkit-volume:
  pg-volume:

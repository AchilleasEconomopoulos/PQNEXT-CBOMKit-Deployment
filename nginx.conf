user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    ssl_certificate /etc/nginx/pki/server.crt;
    ssl_certificate_key /etc/nginx/pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_conf_command Groups X25519MLKEM768/X25519:secp384r1;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream cbomkit_backend {
        server backend:8081;
        keepalive 16;
    }

    upstream cbomkit_frontend {
        server frontend:8000;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_set_header X-TLS-Client-Verify "";
    proxy_set_header X-TLS-Client-Subject "";
    proxy_set_header X-TLS-Client-Serial "";

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        location ^~ /api/v1/cbom/ {
            if ($request_method = POST) {
                return 403;
            }

            proxy_pass http://cbomkit_backend;
        }

        location /api/ {
            proxy_pass http://cbomkit_backend;
        }

        location /v1/ {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass http://cbomkit_backend;
        }

        location / {
            proxy_pass http://cbomkit_frontend;
        }
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_client_certificate /etc/nginx/pki/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location ^~ /api/v1/cbom/ {
            limit_except POST {
                deny all;
            }

            proxy_set_header X-TLS-Client-Verify $ssl_client_verify;
            proxy_set_header X-TLS-Client-Subject $ssl_client_s_dn;
            proxy_set_header X-TLS-Client-Serial $ssl_client_serial;
            proxy_pass http://cbomkit_backend;
        }

        location / {
            return 404;
        }
    }
}
